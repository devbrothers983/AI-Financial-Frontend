<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — AI Financial Coach</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f8fafc;
        }
      }
      .card {
        max-width: 360px;
        text-align: center;
        padding: 32px;
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
      }
      .badge img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9rem;
        color: #64748b;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, #10b981, #4f46e5);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <img src="/icons/icon-192.png" alt="AI Financial Coach" />
      </div>
      <h1>You're offline</h1>
      <p>AI Financial Coach needs a connection to load your latest budgets, goals, and transactions. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
